<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere | Weather Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #e0e7ff 0%, #fef3c7 50%, #dbeafe 100%);
        }
        .forecast-card:hover { transform: translateY(-4px); transition: transform 0.2s ease; }
    </style>
</head>
<body class="gradient-bg min-h-screen p-4 md:p-8 text-slate-800">
    <div id="app" class="max-w-4xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-bold text-slate-900 tracking-tight mb-6">Atmosphere</h1>
            <div class="flex flex-col sm:flex-row gap-2 justify-center max-w-md mx-auto">
                <input type="text" id="location-input" placeholder="Search city..." 
                    class="w-full px-5 py-3 rounded-full border border-slate-200 bg-white/50 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-500/20 shadow-sm transition">
                <button onclick="handleSearch()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-full font-semibold shadow-lg hover:shadow-xl transition transform active:scale-95">
                    Search
                </button>
            </div>
            <p id="location" class="text-slate-500 mt-4 font-medium">Initializing...</p>
        </header>

        <div id="current-weather" class="glass rounded-3xl p-8 shadow-2xl border border-white/50 mb-10">
            <div class="flex flex-col items-center">
                <h2 class="text-sm font-bold uppercase tracking-widest text-slate-400">Current Conditions</h2>
                <div id="temp" class="text-8xl font-black my-6 text-blue-900 tracking-tighter">--°</div>
                <p id="conditions" class="text-xl text-slate-700 font-semibold mb-8">--</p>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6 w-full">
                    <div class="flex flex-col items-center p-4 bg-white/40 rounded-2xl">
                        <svg class="w-6 h-6 mb-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                        <span id="humidity" class="font-bold text-lg">--</span>
                        <span class="text-xs text-slate-500 uppercase">Humidity</span>
                    </div>
                    <div class="flex flex-col items-center p-4 bg-white/40 rounded-2xl">
                        <svg class="w-6 h-6 mb-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span id="wind" class="font-bold text-lg">--</span>
                        <span class="text-xs text-slate-500 uppercase">Wind km/h</span>
                    </div>
                    <div class="flex flex-col items-center p-4 bg-white/40 rounded-2xl">
                        <svg class="w-6 h-6 mb-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <span id="feelslike" class="font-bold text-lg">--</span>
                        <span class="text-xs text-slate-500 uppercase">Feels Like</span>
                    </div>
                    <div class="flex flex-col items-center p-4 bg-white/40 rounded-2xl">
                        <svg class="w-6 h-6 mb-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        <span id="uv" class="font-bold text-lg">--</span>
                        <span class="text-xs text-slate-500 uppercase">UV Index</span>
                    </div>
                </div>
            </div>
        </div>

        <section>
            <h3 class="text-2xl font-bold text-slate-800 mb-6">7-Day Forecast</h3>
            <div id="forecast" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-4">
            </div>
        </section>
    </div>

    <script>
        const API_KEY = "DM296GTCJKNSKFUSUXK44QV94";

        async function fetchWeather(location = "Kanpur") {
            try {
                const sanitizedLocation = encodeURIComponent(location);
                const url = `https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/${sanitizedLocation}?unitGroup=metric&key=${API_KEY}&contentType=json`;
                
                const response = await fetch(url);
                if (!response.ok) throw new Error("Could not find location");
                
                const data = await response.json();
                
                document.getElementById('location').textContent = data.resolvedAddress;
                document.getElementById('temp').textContent = `${Math.round(data.currentConditions.temp)}°`;
                document.getElementById('conditions').textContent = data.currentConditions.conditions;
                document.getElementById('humidity').textContent = `${data.currentConditions.humidity}%`;
                document.getElementById('wind').textContent = data.currentConditions.windspeed;
                document.getElementById('feelslike').textContent = `${Math.round(data.currentConditions.feelslike)}°`;
                document.getElementById('uv').textContent = data.currentConditions.uvindex;

                const forecastContainer = document.getElementById('forecast');
                forecastContainer.innerHTML = '';
                
                data.days.slice(0, 7).forEach(day => {
                    const card = document.createElement('div');
                    card.className = "forecast-card glass p-4 rounded-2xl border border-white/50 text-center shadow-lg";
                    card.innerHTML = `
                        <p class="font-bold text-xs text-slate-500 mb-2">${new Date(day.datetime).toLocaleDateString('en-US', { weekday: 'short' })}</p>
                        <p class="text-3xl font-bold my-2">${Math.round(day.temp)}°</p>
                        <p class="text-[10px] text-slate-600 font-medium uppercase truncate">${day.conditions}</p>
                    `;
                    forecastContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('app').innerHTML = `
                    <div class="text-center p-12 bg-white/50 backdrop-blur rounded-3xl border border-red-100">
                        <p class="text-red-600 font-bold text-xl">Oops!</p>
                        <p class="text-slate-600 mt-2">We couldn't find that location. Please try another city.</p>
                        <button onclick="location.reload()" class="mt-6 bg-slate-900 text-white px-6 py-2 rounded-full hover:bg-slate-800 transition">Try Again</button>
                    </div>
                `;
            }
        }

        function handleSearch() {
            const input = document.getElementById('location-input').value;
            if (input) fetchWeather(input);
        }

        window.onload = () => fetchWeather();
    </script>
</body>
</html>
